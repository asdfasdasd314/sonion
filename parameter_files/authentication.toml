# Runtime behavior for Supabase email/password authentication.
# Supabase project keys belong in .env.local and must not be added here.

auth_method = "email-password"
session_persistence = "browser-local-storage"
session_refresh_leeway_seconds = 60
meal_ownership_source = "verified-bearer-token-user-id"
service_role_exposed_to_browser = false
