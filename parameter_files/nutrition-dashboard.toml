# Client-only nutrition dashboard assumptions.
data_persistence = "meal-history-in-supabase; targets-remain-client-only"
seed_reset_behavior = "disabled"
ai_history_integration = "save-complete-processed-estimate"
meal_title = "omitted"
history_order = "local-date-time-descending"
nullable_nutrient_aggregation = "sum-known-values; null-when-none-known"
weight_unit = "lb"
height_unit = "in"
activity_multiplier_sedentary = 1.20
activity_multiplier_lightly_active = 1.40
activity_multiplier_moderately_active = 1.575
activity_multiplier_very_active = 1.80
calories_per_pound_of_weekly_change = 3500
days_per_week = 7
maximum_change_percent = 100
protein_grams_per_kg = 2.0
fat_grams_per_kg = 0.8
protein_kcal_per_gram = 4
carbohydrate_kcal_per_gram = 4
fat_kcal_per_gram = 9
background_poll_interval_ms = 20000
pause_poll_when_tab_hidden = true
