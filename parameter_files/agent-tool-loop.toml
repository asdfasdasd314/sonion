# Server-only limits for the food interpretation agent.
# These values are intentionally not accepted from the browser or model.

# The model loop has no round-count limit; it continues until the model returns
# a valid result. Keep per-turn and payload limits to protect the tool boundary.
max_calls_per_turn = 4
max_model_output_chars = 24000
# Maximum raw invalid-output preview included in the next model correction turn.
max_correction_output_chars = 4000
max_tool_result_chars = 12000
max_final_content_chars = 8000
