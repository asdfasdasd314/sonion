# Supabase meal-history persistence contract.
storage = "supabase-postgrest"
snapshot_format = "meal-estimate-jsonb"
meal_title = "omitted"
local_date_format = "YYYY-MM-DD"
local_time_format = "HH:mm[:ss]"
audit_timezone = "UTC"
ownership_source = "verified-supabase-bearer-user"
service_role_browser_access = false
user_edit_delete_controls = true
