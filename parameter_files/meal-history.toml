# Supabase meal-history persistence and refinement contract.
# meal_snapshot tracks nullable calories/protein/fat/carbohydrates/fiber; missing fiber normalizes to null.
storage = "supabase-postgrest"
snapshot_format = "meal-estimate-jsonb"
meal_title = "omitted"
revision_max_length = 1200
composed_revision_prompt_max_length = 4000
save_payload = "meal_date,meal_time,meal_snapshot"
local_date_format = "YYYY-MM-DD"
local_time_format = "HH:mm[:ss]"
audit_timezone = "UTC"
ownership_source = "verified-supabase-bearer-user"
service_role_browser_access = false
user_edit_delete_controls = "refinement-save-and-confirmed-delete"
meal_contents_default = "collapsed"
meal_contents_toggle = "per-meal"
legacy_prompt_behavior = "refine-from-saved-foods"
prompt_persistence = "client-session-only"
interpret_and_save = "after-callback-auto-insert"
